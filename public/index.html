  lgalall:function(k){var L=S.lg,G=lgModel(),D=L.draft;if(!G||!G.M||!D)return;if(k==='none')D.alarms={};else lgAlarmList(G)[k].forEach(function(o){if(!D.alarms[o.id])D.alarms[o.id]={id:o.id,no:o.no,text:lgAlarmText(G,o.id)}});lgPaintKeep()}
});
document.addEventListener('change',function(e){
  if(S.view!=='log'||!S.lg)return;var t=e.target,D=S.lg.draft,G;
  var b=t.getAttribute&&t.getAttribute('data-lgb');
  if(b&&D){if(t.checked){G=lgModel();D.bits[b]=lgBitInfo(G,b)}else delete D.bits[b];var hd=document.querySelectorAll('#lg .eyebrow span');lgPaintKeep();return}
  var a=t.getAttribute&&t.getAttribute('data-lga');
  if(a&&D){if(t.checked){G=lgModel();var mm=/^ALARM_?(\d+)$/i.exec(((G&&G.M&&G.M.sym[a])||{}).name||'');D.alarms[a]={id:a,no:mm?mm[1]:'',text:G&&G.M?lgAlarmText(G,a):''}}else delete D.alarms[a];lgPaintKeep();return}
  var w=t.getAttribute&&t.getAttribute('data-lgw');
  if(w&&D){var p=w.split('|');if(p[1]==='on'){if(t.checked){G=lgModel();var WL=G&&G.M?lgWordList(G):[],x=WL.filter(function(z){return z.id===p[0]})[0]||{id:p[0],type:'INT',name:''};D.words[p[0]]={id:p[0],type:x.type,name:x.name||'',unit:''}}else delete D.words[p[0]];lgPaintKeep()}return}
  var o=t.getAttribute&&t.getAttribute('data-lgo');
  if(o&&D){if(o==='on')D.on=t.checked;else if(o==='src'){S.lg.src=t.value;lgPaint()}else D[o]=+t.value;return}
});
document.addEventListener('input',function(e){
  if(S.view!=='log'||!S.lg)return;var t=e.target;
  if(t.id==='lg-q'){S.lg.q=t.value;S.lg.more=200;var r=$('#lg-res');if(r){r.innerHTML=lgResHTML();lgDraw()}return}
  if(t.id==='lg-cq'){S.lg.cq=t.value;clearTimeout(lgCqT);lgCqT=setTimeout(function(){lgPaintKeep()},250);return}
  var at=t.getAttribute&&t.getAttribute('data-lgat');
  if(at&&S.lg.draft&&S.lg.draft.alarms[at]){S.lg.draft.alarms[at].text=t.value;return}
  var w=t.getAttribute&&t.getAttribute('data-lgw');
  if(w&&S.lg.draft){var p=w.split('|'),d=S.lg.draft.words[p[0]];if(d&&p[1]!=='on')d[p[1]]=t.value}
});
var lgCqT=null;
// redraw the settings without losing the place on the page or the box being typed in
function lgPaintKeep(){var sc=$('#lg'),top=sc?sc.scrollTop:0,a=document.activeElement,aid=a&&a.id,pos=a&&a.selectionStart;lgPaint();if(sc)sc.scrollTop=top;if(aid){var n=document.getElementById(aid);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}}
/* ---------- end of the machine log ---------- */
/* ---------- the phone app: the field view follows the studio ---------- */
// a cabinet changed in the studio while it is open on the phone: shown again, unless the user is typing
function fieldFresh(){
  if(S.view!=='cab')return;
  var a=document.activeElement;if(a&&a.closest&&a.closest('#dock,#list')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  render();
}
// a copy of the cabinets is kept on the phone (window.CMCopy, given by the app on the page of the server only), for use without network
var copyT=null,copyBusy=false,copyAgain=false;
function copySoon(){if(!window.CMCopy||S.mode!=='db')return;clearTimeout(copyT);copyT=setTimeout(copyRun,3000)}
function copyRun(){
  var K=window.CMCopy;if(!K||!db)return;
  if(copyBusy){copyAgain=true;return}copyBusy=true;
  var docs=[],blobs={};
  function blob(p){if(p&&p.kind==='asset'&&/^[0-9a-f]{32}$/.test(p.id||''))blobs[p.id]=1}
  function sub(path){return db.collection(path).get().then(function(sn){sn.docs.forEach(function(x){var v=x.data()||{};docs.push([path+'/'+x.id,v]);blob(v.photo)})})}
  ['machines','logcfg'].reduce(function(q,col){return q.then(function(){return sub(col)})},Promise.resolve()).then(function(){return db.collection('cabinets').get()}).then(function(snap){
    var q=Promise.resolve();
    snap.docs.forEach(function(d){var v=d.data()||{};docs.push(['cabinets/'+d.id,v]);blob(v.photo);if(v.photo&&v.photo.kind==='doc')q=q.then(function(){return db.doc('photos/'+d.id).get().then(function(x){if(x.exists)docs.push(['photos/'+d.id,x.data()||{}])})});
      ['sheets','sheetimg'].forEach(function(k){q=q.then(function(){return sub('cabinets/'+d.id+'/'+k)})})});
    return q;
  }).then(function(){
    var q=Promise.resolve();
    Object.keys(blobs).forEach(function(id){if(K.hasAsset(id))return;q=q.then(function(){
      return fetch('/_blob/'+id,{credentials:'same-origin'}).then(function(r){if(!r.ok)throw new Error('blob');return r.blob()}).then(function(b){return b.arrayBuffer().then(function(ab){K.saveAsset(id,b64Enc(new Uint8Array(ab)),b.type||'image/jpeg')})}).catch(function(){});
    })});
    return q;
  }).then(function(){
    if(!K.begin())throw new Error('copy');
    docs.forEach(function(x){K.put(x[0],JSON.stringify(x[1]))});
    var at=new Date().toISOString();
    if(!K.commit(at))throw new Error('copy');
    S.copyAt=at;if(S.view==='home'&&S.app==='field')render();
  }).catch(function(){}).then(function(){copyBusy=false;if(copyAgain){copyAgain=false;copySoon()}});
}
function copyInfo(){var A=window.CMAndroid;try{return A&&A.copyInfo?JSON.parse(A.copyInfo()||'null'):null}catch(e){return null}}
function copyNote(){
  var h=window.cmHost||{};
  if(h.local){
    var ci=copyInfo();
    return '<p class="note">'+(ci&&ci.at?'Copy kept on this phone, from '+esc(fmtDate(ci.at))+'. Changes made in the studio since then are not in it.':'The cabinets delivered with the app. Connect to the server once to get the cabinets of the studio.')+' <a href="/_server">'+(ci&&ci.server?'Connect to the server':'Connect to a server')+'</a></p>';
  }
  var L=h.link?h.link():null,hm=function(t){return new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})};
  // the state of the connection: the app asks the server every 5 seconds (every 30 s while the screen is off)
  var st=L&&L.ok===false?'<b class="bad">No answer from the server'+(L.since?' since '+esc(hm(L.since)):'')+'.</b> What you see is the last state received; it updates by itself when the server answers again.':'<b class="ok">Connected to the server.</b> Studio changes show here within a few seconds.';
  if(window.CMCopy)return '<p class="note">'+st+' '+(S.copyAt?'Copy for use without network: '+esc(hm(S.copyAt))+' (renewed each time something changes in the studio).':'A copy for use without network is being kept on this phone.')+'</p>';
  if(h.role&&L)return '<p class="note">'+st+'</p>';
  return '';
}

// the connection to the server came back or was lost: the list of machines shows it
window.addEventListener('cm-link',function(){if(S.ready&&S.view==='home'&&S.mid==null)render()});
/* ---------- boot ---------- */
function subscribe(){
  db.collection('cabinets').onSnapshot(function(snap){
    var seen=new Set(),touched=false,changed=[];
    copySoon();
    snap.docs.forEach(function(d){
      seen.add(d.id);
      if(importing.has(d.id))return;   // a cabinet file is still being stored; its cabinets appear together at the end
      var pth='cabinets/'+d.id;if(dirty.has(pth)||saving.has(pth))return;
      var nc=normCab(d.id,JSON.parse(JSON.stringify(d.data()||{}))),old=S.cabs.get(d.id);
      if(old&&JSON.stringify(serial(old))===JSON.stringify(serial(nc)))return;
      S.cabs.set(d.id,nc);localOnly.delete(d.id);touched=true;changed.push(d.id);
    });
    Array.from(S.cabs.keys()).forEach(function(id){if(!seen.has(id)&&!localOnly.has(id)&&!dirty.has('cabinets/'+id)&&!saving.has('cabinets/'+id)){S.cabs.delete(id);touched=true}});
    var first=!S.ready;S.ready=true;
    if(first){render();return}
    if(!touched||S.view==='new'||S.view==='log'||S.view==='drives'||S.view==='pm'||drag)return;
    if(S.app==='field')changed.forEach(function(id){if(sheetStore.has(id))loadSheets(id)});
    if(S.view==='cab'){
      if(!cur()){S.view='home';S.cabId=null;render();return}
      if(S.sel&&!comp(S.sel))S.sel=null;
      if(S.app==='field'){fieldFresh(changed);return}     // the phone: a tapped button in the panel must not hold the new version back
      var a=document.activeElement;if(a&&a.closest&&a.closest('#dock,#list'))return;
      if(S.tab==='list'||S.tab==='check')render();else if(S.tab==='wiring'){if(!S.wbusy)render()}else{renderDock();renderStage()}
    }else render();
  },function(){S.mode='local';S.ready=true;render()});
}
function checkAI(){
  if(!sample||!sample.limits){S.ai=false;S.aiWhy=(window.cmHost&&window.cmHost.role)?'nokey':(window.claude&&typeof window.claude.use==='function')?'nosample':'noclaude';return Promise.resolve(false)}
  return Promise.resolve().then(function(){return sample.limits()}).then(function(l){var was=S.ai;S.ai=!!(l&&l.images);S.aiMax=l&&l.images?(+l.images.maxCount||1):0;S.aiWhy=S.ai?'':'noimg';return was!==S.ai},function(){S.ai=false;S.aiWhy='err';return false});
}
// on a phone that runs the app in the browser, from the server: a link to install it
function installHint(){
  if(inApp()||!window.cmHost||!window.cmHost.role||!/Android/i.test(navigator.userAgent))return '';
  return '<p class="note">The field view is in the phone app. <a href="/install">Get the Android app</a>.</p>';
}
function aiWhy(){return ({nokey:'No Claude API key is set on the server. Add ANTHROPIC_API_KEY to the server settings and restart it.',noclaude:'This copy of the page is not connected to Claude. A downloaded file cannot read photos. Open the published app from claude.ai while signed in.',nosample:'Claude is not available to this page for your account, or in this app.',noimg:'Claude is connected, but this app or browser cannot send photos to it. Open the page in a desktop browser while signed in.',err:'The connection to Claude could not be checked. Reload the page.'})[S.aiWhy]||'It is not available in this view.'}
function subPub(){
  db.collection('published').onSnapshot(function(snap){
    var m=new Map();snap.docs.forEach(function(d){m.set(d.id,normCab(d.id,JSON.parse(JSON.stringify(d.data()||{}))))});S.pub=m;
    if(!S.ready||S.app!=='field')return;
    if(S.view==='cab'&&!cur()){S.view='home';S.cabId=null;render()}else if(S.view==='home')render();
  },function(){});
}
function start(){
  photoDefs();
  S.app=pickApp();
  try{if(localStorage.getItem('cm-look')==='real')S.real=true}catch(e){}
  render();
  var cl=window.claude,use=function(nm){try{return cl&&typeof cl.use==='function'?Promise.resolve(cl.use(nm)).catch(function(){return null}):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
  Promise.all([use('db'),use('user'),use('sample'),use('assets')]).then(function(r){
    db=r[0];user=r[1];sample=r[2];assets=r[3];
    var jobs=[];
    jobs.push(checkAI());
    if(db&&user&&user.can)jobs.push(Promise.resolve(user.can('data.write')).then(function(v){if(v===false)S.canWrite=false},function(){}));
    return Promise.all(jobs);
  }).then(function(){
    if(db){S.mode='db';subMachines();subscribe()}else{S.mode='local';S.ready=true;render()}
  });
}
start();
})();
