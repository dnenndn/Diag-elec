<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B5C6E">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cabinets">
<script>if('serviceWorker' in navigator&&window.isSecureContext)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script src="adapter.js"></script>
<title>Cabinet Mapper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Top bar, cabinet stage fills the middle, detail sheet docks under it. */
:root{
  --bg:#E3E6E2; --surface:#F4F6F3; --raised:#FFFFFF; --ink:#15232A; --ink-2:#4D5D64; --line:#C6CDC9;
  --accent:#0B5C6E; --accent-ink:#FFFFFF; --warn:#9A4A06; --warn-bg:#FBE9D0; --danger:#B3261E; --stage:#262D32;
  --k-power:#C8452C; --k-control:#6B4FB8; --k-drive:#1E8A63; --k-term:#A9770F; --k-field:#2F6FB5; --k-other:#B3261E;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11171A; --surface:#192125; --raised:#222C31; --ink:#E6ECEA; --ink-2:#9FB0B4; --line:#34424A;
  --accent:#5CC2D6; --accent-ink:#062A32; --warn:#F0A655; --warn-bg:#3A2A14; --danger:#F2867E; --stage:#0A0E10;
  --k-power:#EE7A60; --k-control:#A792F0; --k-drive:#4FC79A; --k-term:#E0B04A; --k-field:#7FB4F0; --k-other:#F2867E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#192125; --raised:#222C31; --ink:#E6ECEA; --ink-2:#9FB0B4; --line:#34424A;
  --accent:#5CC2D6; --accent-ink:#062A32; --warn:#F0A655; --warn-bg:#3A2A14; --danger:#F2867E; --stage:#0A0E10;
  --k-power:#EE7A60; --k-control:#A792F0; --k-drive:#4FC79A; --k-term:#E0B04A; --k-field:#7FB4F0; --k-other:#F2867E; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{height:100%;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-direction:column;min-height:0}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.tag{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.02em}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.icon{border:0;background:transparent;width:44px;height:44px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;line-height:1;flex:none}
.icon:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}

/* home */
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
.home-head{padding-top:6px;display:flex;flex-direction:column;gap:4px}
.home-head h1{font-size:30px;line-height:1.05;letter-spacing:.01em}
.lede{margin:0;color:var(--ink-2);max-width:46ch}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0}
.cabs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cabcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px;display:flex;gap:12px;align-items:center}
.cabcard:hover{border-color:var(--accent)}
.thumb{width:66px;height:88px;border-radius:6px;object-fit:cover;background:var(--stage);flex:none;display:block}
.cabcard .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.cabcard strong{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1}
.cabcard .d{color:var(--ink-2)}
.cabcard .m{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cabcard .m b{color:var(--warn);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-2);margin:0}

/* cabinet */
.top{display:flex;align-items:center;gap:4px;flex:none;margin-left:-10px}
.top .ttl{min-width:0;flex:1;display:flex;flex-direction:column}
.top .ttl strong{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:12px;color:var(--ink-2)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;flex:none;margin-block:8px}
.tabs button{border:0;background:transparent;border-radius:7px;min-height:38px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.stagewrap{flex:1;min-height:150px;min-width:0;position:relative;display:flex}
#stage{flex:1;min-width:0;overflow:auto;background:var(--stage);border-radius:10px;overscroll-behavior:contain}
#cv{display:block;margin:0 auto;user-select:none;-webkit-user-select:none}
.tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.tools button{width:40px;height:40px;border-radius:8px;border:1px solid #0004;background:#FFFFFFE6;color:#15232A;font-size:20px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
.tools button.txt{font-size:11px;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tools button[aria-pressed="false"]{opacity:.65}

#stage{cursor:grab;touch-action:pan-x pan-y}
#stage.panning,#stage.panning *{cursor:grabbing!important}
#cv image{-webkit-user-drag:none}
#cv .cp{cursor:pointer}
#cv .k-power{--cc:#FF6B4A} #cv .k-control{--cc:#A58BFF} #cv .k-drive{--cc:#2FD39B} #cv .k-term{--cc:#FFC247} #cv .k-field{--cc:#4DA3FF} #cv .k-other{--cc:#FF4D4D}
#cv .bx{fill:color-mix(in srgb,var(--cc) 22%,transparent);stroke:var(--cc);stroke-width:1.8px;vector-effect:non-scaling-stroke}
#cv .chk .bx{stroke-dasharray:5 3}
#cv.nobox .cp:not(.sel) .bx{fill:transparent;stroke:none}
#cv .ro{fill:none;stroke:#000;stroke-opacity:.5;stroke-width:1px;vector-effect:non-scaling-stroke}
#cv .ck{fill:none;stroke:#E08A00;stroke-width:2px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#cv .so0{fill:none;stroke:#000;stroke-opacity:.6;stroke-width:6px;vector-effect:non-scaling-stroke}
#cv .so{fill:none;stroke:#fff;stroke-width:2.5px;vector-effect:non-scaling-stroke}
#cv .hd{fill:#fff;stroke:#15232A;stroke-width:2px;vector-effect:non-scaling-stroke;cursor:nwse-resize}
#cv .cp.sel,#cv .cp.sel *{touch-action:none}
#cv .cp.sel{cursor:move}
#cv text{font-family:var(--f-mono);font-weight:500;pointer-events:none}
#cv .tg{fill:#1B262B;stroke:#C2C7C6;stroke-width:3px;paint-order:stroke;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#cv .tgs{fill:#fff;stroke:#000;stroke-opacity:.75;stroke-width:4px;paint-order:stroke;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* dock */
#dock{flex:none;max-height:58%;overflow:auto;margin-top:8px}
@media (min-width:900px){ #app{max-width:none;padding-inline:20px} .work{flex-direction:row;gap:12px} #dock{width:clamp(360px,26vw,520px);max-height:none;margin-top:0}
  .cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr))} .lede{max-width:none} }
.bar{display:flex;gap:10px;align-items:center}
.bar .sum{flex:1;min-width:0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar .sum b{color:var(--warn);font-weight:600}
.sheet{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head .t{flex:1;min-width:0;display:flex;flex-direction:column}
.sheet-head .t strong{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.15}
.sheet-head .icon{margin:-6px -8px -6px 0}
.mini{flex:none;display:block}
.check{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center;font-size:13px}
.check span{flex:1;min-width:0}
.check .btn{min-height:36px;padding:6px 10px;color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;gap:8px 10px}
.fields label{grid-column:span 3}
.fields .t2{grid-column:span 4}
.fields .t2+label{grid-column:span 2}
.fields label,.stack label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--ink-2);min-width:0}
.fields .wide{grid-column:1/-1}
.sheet input[type=text],.sheet select,.sheet textarea{min-height:40px;padding:7px 9px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);min-height:42px}
textarea{resize:vertical;min-height:42px;line-height:1.3;field-sizing:content;max-height:130px}
input:disabled,select:disabled,textarea:disabled{opacity:.75}
#f-tag{font-family:var(--f-mono)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts .btn{flex:1}
.acts p{margin:0;flex:1 1 100%;font-size:13px}
.hint{font-size:12px;color:var(--ink-2);margin:0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lib button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;display:flex;align-items:center;gap:8px;text-align:left;font-size:13px;line-height:1.2;min-height:56px}
.lib button:hover{border-color:var(--accent)}

/* list */
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp h3{font-size:14px;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:10px 2px 6px}
.grp h3 i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--kc)}
.grp h3 span{color:var(--ink-2);font-family:var(--f-body);font-weight:400;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}
.rows li+li{border-top:1px solid var(--line)}
.rows button{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;padding:8px 10px;min-height:46px}
.rows button:hover{background:var(--surface)}
.rows .nm{min-width:0;display:flex;flex-direction:column}
.rows .nm small{color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--k-drive) 18%,transparent);color:var(--k-drive)}

/* new */
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.preview{border-radius:10px;overflow:hidden;background:var(--stage);max-height:42vh;display:flex;justify-content:center}
.preview img{max-height:42vh;width:auto;display:block}
.status{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--raised)}
.status span{flex:1;min-width:0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){ .spin{animation:sp 0.9s linear infinite} }
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:14px;z-index:5}
.tabs{grid-template-columns:repeat(4,1fr)}
.eyebrow span{font-family:var(--f-body);font-weight:400;letter-spacing:0}
.tag.auto{opacity:.65}
#cv .wl0{fill:none;stroke:#000;stroke-opacity:.55;stroke-width:5px;vector-effect:non-scaling-stroke;pointer-events:none}
#cv .wl{fill:none;stroke:#19D3FF;stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#cv .wa{fill:none;stroke:#19D3FF;stroke-opacity:.55;stroke-width:1.3px;vector-effect:non-scaling-stroke;pointer-events:none}
#cv .pk{fill:none;stroke:#19D3FF;stroke-width:3px;vector-effect:non-scaling-stroke;pointer-events:none}
#cv .tb{cursor:pointer}
#cv .tb rect{fill:transparent;stroke-width:2px;vector-effect:non-scaling-stroke}
#cv .tb.ok rect{stroke:#1E9E6A;fill:#1E9E6A22}
#cv .tb.no rect{stroke:#E08A00;stroke-dasharray:5 3;fill:#E08A0018}
#cv .tb.pot rect{stroke:#7A868C;stroke-opacity:.6}
#cv .tb.hl rect{stroke:#0AA5D8;stroke-width:4px;fill:#19D3FF33;stroke-dasharray:none}
.shs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.shcard{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;font-size:13px;line-height:1.2}
.shcard:hover{border-color:var(--accent)}
.shcard img,.shcard .ph{width:100%;aspect-ratio:1.41;object-fit:cover;object-position:top left;border-radius:4px;background:#fff;display:block;border:1px solid var(--line)}
.shcard strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shcard small{color:var(--ink-2);font-size:11px}
.wrows button{grid-template-columns:1fr auto}
.wrows .nm small{white-space:normal}
.wform{padding:4px 10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.wform input[type=text]{min-height:40px;padding:7px 9px;background:var(--raised)}
.conn{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:6px;padding-right:8px}
.crow button:first-child{display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex:1;min-width:0}
.crow small{color:var(--ink-2);font-size:12px}
.crow .go{width:auto;min-height:34px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;background:var(--surface);flex:none;display:inline-flex}
.sheet-head input[type=text]{font-family:var(--f-display);font-size:18px;font-weight:600}
.scroll>*{flex-shrink:0}
.tabs{grid-template-columns:repeat(var(--n,4),1fr)}
.tabs button{font-size:14px;padding-inline:2px}
.vbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raised);display:flex;flex-direction:column;gap:2px}
.vbox strong{font-family:var(--f-display);font-size:19px;font-weight:600}
.vbox.ok strong{color:var(--k-drive)}
.vbox.changed strong,.vbox.draft strong{color:var(--warn)}
.vbox span{color:var(--ink-2);font-size:14px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{text-align:left;padding:7px 10px;border-top:1px solid var(--line)}
.cmp thead th{border-top:0;font-size:12px;color:var(--ink-2);font-weight:500}
.cmp th:nth-child(2),.cmp th:nth-child(3),.cmp td:nth-child(2),.cmp td:nth-child(3){text-align:right;width:74px}
.irow{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.irow .nm{flex:1;min-width:120px;display:flex;flex-direction:column}
.irow .nm small{color:var(--ink-2);font-size:12px}
.rows .ib{display:flex;gap:6px;flex-wrap:wrap}
.rows .ib button{width:auto;display:inline-flex;align-items:center;min-height:34px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;background:var(--surface)}
.g2h{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
.g2h span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.tips{display:flex;flex-direction:column;gap:8px;font-size:14px}
.tips p{margin:0}
.tips ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.answer{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px}
.kv{margin:0;font-size:14px}
.kv b{font-weight:500;color:var(--ink-2);margin-right:6px}
a.btn{text-decoration:none;color:var(--ink)}
.frow{padding:8px 10px;display:flex;flex-direction:column}
.frow small{color:var(--ink-2);font-size:12px}
#find{max-width:150px}
.cabcard .st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;align-self:flex-start;background:var(--warn-bg);color:var(--warn)}
.cabcard .st.ok{background:color-mix(in srgb,var(--k-drive) 18%,transparent);color:var(--k-drive)}
#cv.ly .wa{stroke:#1F5FD1;stroke-opacity:.75;stroke-width:1.1px;stroke-linejoin:round}
#cv .wl,#cv .wl0{stroke-linejoin:round}
#cv .wh{fill:none;stroke:transparent;stroke-width:12px;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
#cv .stub{cursor:pointer}
#cv .stub rect{fill:#E9EEF7;stroke:#1F5FD1;stroke-width:1.5px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#cv .stub text{fill:#16407F;font-family:system-ui,sans-serif!important;pointer-events:none}
#cv.ly .wa.xw{stroke-dasharray:6 3}
/* diagnosis */
.dx{display:flex;flex-direction:column;gap:12px;min-width:0}
.dxcols{display:grid;gap:12px;align-items:start}
@media (min-width:1100px){.dxcols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.dxcard{border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dxres{border-radius:8px;padding:9px 12px;font-weight:500}
.dxres.ok{background:color-mix(in srgb,var(--k-drive) 16%,transparent)}
.dxres.bad{background:var(--warn-bg);color:var(--warn)}
.dxres.unk{background:var(--surface);border:1px solid var(--line)}
.dxt,.dxt ul,.dxneed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.dxt ul{padding-left:12px;margin:4px 0 2px 4px;border-left:2px solid var(--line)}

var PROMPT2='The images show ONE page of an electrical schematic (circuit diagram) for an industrial control cabinet. The first image is the whole page. If there are four more images, they are enlarged quarters of the same page (top-left, top-right, bottom-left, bottom-right) so that small text is readable. Extract the devices and the wire connections drawn on this page.\n\nReply with only one JSON object, no other text:\n{"title": string, "page": string, "potentials": [string], "devices": [{"tag": string, "kind": string, "type": string, "box": [x0, y0, x1, y1]}], "wires": [{"from": string, "fromTerm": string, "to": string, "toTerm": string, "wire": string, "sure": boolean}]}\n\n- "title": the page title from the title block, at most 6 words, or "".\n- "page": the page number printed in the title block, or "".\n- "potentials": the names of supply rails, earth and signal lines that appear as wire ends on this page but are not devices (for example L1, PE, 24V, L-, 21BL+).\n- "devices": every device symbol on the page. "tag" is its device tag exactly as printed (for example -Q1, -K3, -X1, -M2). "kind" is what it is, at most 4 words. "type" is one of: mpcb (motor protection breaker), mcb (miniature circuit breaker), mccb (large moulded-case breaker), contactor, fuse (fuse terminal or electronic protector), fuseholder, psu (power supply), transformer, plc (PLC CPU or head module), io (PLC input/output module), repeater (fieldbus repeater, switch or gateway), safety (safety relay), auxrelay (small relay), drive (servo drive or frequency inverter), vfd (compact inverter), terminal (terminal strip), field (a device that is NOT inside the cabinet: motor, sensor, valve, push button or lamp on the machine), or other. "box" is the position of the symbol on the WHOLE page in thousandths of the page width (x) and height (y), top-left origin.\n- "wires": every direct electrical connection between two device terminals. "from" and "to" are device tags. "fromTerm" and "toTerm" are the terminal designations as printed (for example 13, A1, 2/T1), or "" when none is printed. "wire" is the wire number or label if printed, otherwise "".\n- When one conductor joins more than two terminals, list it as a chain: A to B, then B to C.\n- For supply rails, earth and named potentials, use the name exactly as printed as the tag (L1, N, PE, 24V, L-, 21BL+). Do the same for a line that leaves to another page through a reference arrow.\n- A terminal of a terminal strip is written as the strip tag with the terminal number as the terminal (tag -X1, terminal 18).\n- Dashed lines are usually the cores of a cable. They are connections too.\n- If the page is a cover sheet, a table or a list with no circuit, return empty devices and wires.\n- "sure" is false when you could not read a label or could not follow the line clearly.\n- Never invent a connection you cannot see. It is better to leave a wire out than to guess.\n- At most 80 devices and 150 wires.';

  var s='<div class="top"><button class="icon" data-act="home" aria-label="Back to cabinets">&#8249;</button><div class="ttl"><strong>'+esc(macName(g))+'</strong><span>'+cabs.length+' cabinets · connections between them</span></div></div><div class="scroll" id="list">';
  if(!cabs.length)return s+'<div class="empty">No cabinet is in this machine any more.</div></div>';
  cabs.forEach(function(c){nbr[c.id]=[]});D.edges.forEach(function(e){nbr[e.a.id].push(e);nbr[e.b.id].push(e)});
  // hubs are cabinets linked to two or more others; a cabinet linked to one hub is drawn under it
  var hub={},parent={},rows=[],extra=[];
  cabs.forEach(function(c){if(nbr[c.id].length>=2)hub[c.id]=1});
  cabs.forEach(function(c){if(nbr[c.id].length===1){var e=nbr[c.id][0],o=e.a===c?e.b:e.a;if(!hub[o.id]&&!hub[c.id])hub[o.order<=c.order?o.id:c.id]=1}});
  cabs.forEach(function(c){if(hub[c.id]||!nbr[c.id].length)return;var best=null;nbr[c.id].forEach(function(e){var o=e.a===c?e.b:e.a;if(hub[o.id]&&(!best||e.rows.length>best.e.rows.length))best={o:o,e:e}});if(best)parent[c.id]=best});
  cabs.forEach(function(c){if(!hub[c.id])return;rows.push({c:c,lvl:0});cabs.forEach(function(k){if(parent[k.id]&&parent[k.id].o===c)rows.push({c:k,lvl:1,e:parent[k.id].e})})});
  cabs.forEach(function(c){if(!hub[c.id]&&!parent[c.id])rows.push({c:c,lvl:0,alone:!nbr[c.id].length})});
  var rowOf={};rows.forEach(function(r,i){rowOf[r.c.id]=i});
  D.edges.forEach(function(e){var pa=parent[e.a.id],pb=parent[e.b.id];if((pa&&pa.e===e)||(pb&&pb.e===e))return;extra.push(e)});
  var RH=58,BH=42,lm=22+extra.length*16,BW=236,W=lm+40+BW+96,H=rows.length*RH+14,sv='';
  extra.forEach(function(e,i){var y1=rowOf[e.a.id]*RH+10+BH/2,y2=rowOf[e.b.id]*RH+10+BH/2,x=lm-12-i*16,xa=lm+(rows[rowOf[e.a.id]].lvl?40:0),xb=lm+(rows[rowOf[e.b.id]].lvl?40:0),on=S.netSel===e.k;
    sv+='<g class="ne'+(on?' on':'')+'" data-act="netedge" data-id="'+esc(e.k)+'"><path d="M'+n(xa)+' '+n(y1)+' H'+n(x)+' V'+n(y2)+' H'+n(xb)+'"/><path class="hit" d="M'+n(xa)+' '+n(y1)+' H'+n(x)+' V'+n(y2)+' H'+n(xb)+'"/><text x="'+n(x+5)+'" y="'+n((y1+y2)/2+4)+'">'+e.rows.length+'</text></g>'});
  rows.forEach(function(r,i){var y=i*RH+10,x=lm+(r.lvl?40:0),nm=r.c.name.length>30?r.c.name.slice(0,29)+'…':r.c.name;
    if(r.lvl){var hy=rowOf[parent[r.c.id].o.id]*RH+10+BH,on=S.netSel===r.e.k;
      sv+='<g class="ne'+(on?' on':'')+'" data-act="netedge" data-id="'+esc(r.e.k)+'"><path d="M'+n(lm+18)+' '+n(hy)+' V'+n(y+BH/2)+' H'+n(x)+'"/><path class="hit" d="M'+n(lm+18)+' '+n(y)+' V'+n(y+BH/2)+' H'+n(x)+'"/><text x="'+n(x+BW+8)+'" y="'+n(y+BH/2+4)+'">'+wiresTxt(r.e.rows.length)+'</text><rect class="hit" x="'+n(x+BW)+'" y="'+n(y)+'" width="96" height="'+BH+'" fill="transparent"/></g>'}
    sv+='<g class="nn'+(r.alone?' alone':'')+'" data-act="opencab" data-id="'+esc(r.c.id)+'"><rect x="'+n(x)+'" y="'+n(y)+'" width="'+BW+'" height="'+BH+'" rx="7"/><text x="'+n(x+12)+'" y="'+n(y+18)+'" class="t1">'+esc(nm)+'</text><text x="'+n(x+12)+'" y="'+n(y+33)+'" class="t2">'+r.c.comps.length+(r.c.comps.length===1?' component':' components')+(r.alone?' · no link found':'')+'</text></g>'});
  s+='<svg class="net" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n(W)+' '+n(H)+'" style="max-width:'+Math.round(W*1.5)+'px" role="img" aria-label="Connections between the cabinets of '+esc(g)+'">'+sv+'</svg>';
  if(loading)s+='<p class="note">Loading the drawings of the group.</p>';
  else if(!D.edges.length)s+='<p class="note">No wire goes from one of these cabinets to another yet. A link appears when a wire on the drawings of one cabinet ends on a confirmed tag of another cabinet.</p>';
  else if(!S.netSel)s+='<p class="note">Tap a cabinet to open it. Tap a line or a number to list the wires between two cabinets.</p>';
  var sel=D.edges.filter(function(e){return e.k===S.netSel})[0];
  if(sel){
    s+='<div class="ghead"><p class="eyebrow">'+esc(sel.a.name)+' ↔ '+esc(sel.b.name)+' <span>'+sel.rows.length+'</span></p></div>';
    s+='<ul class="rows">'+sel.rows.slice(0,200).map(function(x){var w=x.w;
      return '<li class="crow"><button data-act="goto" data-id="'+esc(x.a.cab.id+'|'+x.a.comp.id)+'"><span class="tag">'+esc(endTxt(x.ta,x.at)+' → '+endTxt(x.tb,x.bt))+'</span><small>'+esc([w.no?'wire '+w.no:'',x.sh.name,'drawing of '+x.home.name,w.note].filter(Boolean).join(' · '))+'</small></button>'+(w.chk?'<span class="badge">Check</span>':'')+(x.sh.id!=='manual'?'<button class="go" data-act="xdraw" data-id="'+esc(x.home.id+'|'+x.sh.id+'|'+(x.home===x.a.cab?x.ta:x.tb))+'">Drawing</button>':'')+'</li>'}).join('')+'</ul>';
    s+='<div class="acts"><button class="btn" data-act="opencab" data-id="'+esc(sel.a.id)+'">Open '+esc(sel.a.name)+'</button><button class="btn" data-act="opencab" data-id="'+esc(sel.b.id)+'">Open '+esc(sel.b.name)+'</button></div>';
  }
  if(false){
    var nv=cabs.filter(function(c){return valState(c)!=='ok'}).length;
    if(S.vbusy)s+='<div class="status"><i class="spin"></i><span>Validating the cabinets.</span></div>';
    else if(S.confirm==='valall')s+='<div class="acts"><p>Validate all '+cabs.length+' cabinets of this group for the field view? Open points are not reviewed here; check each cabinet first if you have not done so.</p><button class="btn primary" data-act="valallyes">Validate all</button><button class="btn" data-act="delno">Cancel</button></div>';
    else s+='<div class="acts"><button class="btn'+(nv?' primary':'')+'" data-act="valall">Validate all '+cabs.length+' cabinets for the field view</button>'+(nv?'':'<span class="sum">All are validated.</span>')+'</div>';
  }
  return s+'</div>';
}
function groupsHTML(list,card,plain){
  return '<div class="ghead"><p class="eyebrow">'+plain+' <span>'+list.length+'</span></p>'+(list.length>1?'<button class="btn" data-act="net" data-id="'+esc(S.mid)+'">Connections</button>':'')+'</div><ul class="cabs">'+list.map(card).join('')+'</ul>';
}
// The wires of one component, grouped by its pins. Declared pins (from a cabinet file) come first, in their own order.
function natCmp(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true})}
function pinRows(cab,k){
  var rows=wireEnds(cab).filter(function(x){return (x.a&&x.a.comp===k)||(x.b&&x.b.comp===k)}),pins={},order=[];
  function pin(p){p=String(p||'')||'–';if(!pins[p]){pins[p]={p:p,l:'',x:'',c:[]};order.push(p)}return pins[p]}
  (k.pins||[]).forEach(function(d){var q=pin(d.p);q.l=d.l;q.x=d.x});
  var nd=order.length;
  rows.forEach(function(x){
    var w=x.w,ia=!!(x.a&&x.a.comp===k),ib=!!(x.b&&x.b.comp===k);
    if(ia)pin(w.at).c.push({x:x,pt:w.b,ptr:w.bt,pe:x.b});
    if(ib)pin(w.bt).c.push({x:x,pt:w.a,ptr:w.at,pe:x.a});
  });
  return {n:rows.length,pins:order.slice(0,nd).concat(order.slice(nd).sort(natCmp)).map(function(p){
    var q=pins[p];
    if(!q.l){var cnt={},best='';q.c.forEach(function(c){var no=c.x.w.no;if(no){cnt[no]=(cnt[no]||0)+1;if(!best||cnt[no]>cnt[best])best=no}});q.l=best}
    return q})};
}
function pinConn(cab,k,q,c,slim){
  var x=c.x,w=x.w,pe=c.pe,self=!!pe&&pe.comp===k,far=!!pe&&pe.cab!==cab,hx=x.home!==cab,nk=normTag(k.tag);
  var kind=self?'Bridge on this component':pe?(far?'In '+pe.cab.name:TY(pe.comp.t).label):(isPot(c.pt)?'Supply or earth':isExt(x.home,c.pt)?'Outside this cabinet':'Not matched yet');
  var act=pe&&!self&&(far||hx)?'data-act="goto" data-id="'+esc(pe.cab.id+'|'+pe.comp.id)+'"':'data-act="peer" data-id="'+esc(w.id)+'"';
  var pg=String(x.sh.name).split(' · ')[0],sub=[slim&&!far&&!self?'':kind,w.no&&w.no!==q.l?'wire '+w.no:'',w.note].filter(Boolean).join(' · ');
  return '<div class="pc'+(far?' far':'')+(pe||isExt(x.home,c.pt)||isPot(c.pt)?'':' open')+'"><button '+act+'><span class="tag">'+esc(endTxt(c.pt,c.ptr))+'</span>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</button><span class="pm">'+(w.chk?'<span class="badge">Check</span>':'')+(x.sh.id!=='manual'?'<button class="go" '+(hx?'data-act="xdraw" data-id="'+esc(x.home.id+'|'+x.sh.id+'|'+nk)+'"':'data-act="todraw" data-id="'+esc(w.id)+'"')+' aria-label="Open the drawing '+esc(pg)+'">'+esc(pg.length>9?'Drawing':pg)+'</button>':'<span class="hand">by hand</span>')+'</span></div>';
}
function connHTML(cab,k){
  var has=sheets().length>0;
  if(!k.tagOk)return S.app==='field'?'':has&&k.t!=='foreign'?'<p class="hint">This tag was given automatically. Enter the tag this component has on the drawing to see its wiring.</p>':'';
  var nk=normTag(k.tag),R0=pinRows(cab,k),pins=R0.pins,used=pins.filter(function(q){return q.c.length}).length;
  var s='<div class="ghead"><p class="eyebrow">Pins and wires <span>'+pins.length+(pins.length===1?' pin':' pins')+' · '+wiresTxt(R0.n)+'</span></p><button class="btn widebtn" data-act="wide" aria-pressed="'+!!S.wide+'">'+(S.wide?'Narrower':'Wider')+'</button></div>';
  if(!pins.length)return s+'<p class="hint">'+(has?'No wires for '+esc(nk)+' were found on the drawings.':'No drawings added yet. Add them in the Wiring tab.')+'</p>';
  if(k.t==='terminal'){
    // a strip is shown as a terminal plan: one side per row end. Left is the cabinet side, right is what leaves it.
    var own=pins.some(function(q){return q.c.some(function(c){return c.pe&&c.pe.cab===cab&&c.pe.comp!==k})});
    var side=function(c){var cls=c.pe?(c.pe.cab===cab?0:1):2;return own?(cls===0?0:1):(cls===1?0:1)};
    s+='<div class="pinhead"><span>'+(own?'In this cabinet':'To another cabinet')+'</span><span>Terminal</span><span>'+(own?'Leaves the cabinet':'On the machine')+'</span></div><ul class="pins strip">';
    s+=pins.slice(0,200).map(function(q){
      var L=q.c.filter(function(c){return side(c)===0}),Rr=q.c.filter(function(c){return side(c)===1});
      return '<li class="pin'+(q.c.length?'':' free')+'"><div class="sd">'+L.map(function(c){return pinConn(cab,k,q,c,true)}).join('')+'</div><div class="mid"><span class="pno">'+esc(q.p)+'</span>'+(q.l?'<span class="pl">'+esc(q.l)+'</span>':'')+'</div><div class="sd">'+Rr.map(function(c){return pinConn(cab,k,q,c,true)}).join('')+'</div>'+(q.x||!q.c.length?'<small class="px">'+esc([q.x,q.c.length?'':'Nothing connected on the drawings'].filter(Boolean).join(' · '))+'</small>':'')+'</li>'}).join('');
    return s+'</ul>';
  }
  var PM=progModel(cab);
  s+='<ul class="pins">'+pins.slice(0,200).map(function(q){
    return '<li class="pin'+(q.c.length?'':' free')+'"><div class="ph"><span class="pno">'+esc(q.p)+'</span><span class="pt">'+(q.l?'<span class="pl">'+esc(q.l)+'</span>':'')+(q.x?'<small>'+esc(q.x)+'</small>':'')+(q.c.length?'':'<small>Nothing connected on the drawings</small>')+'</span>'+(PM&&q.l&&(PM.ins[q.l]||PM.outs[q.l]||/^(DB\d+\.DBX\d+\.\d|[EAIQ]\d+\.\d)$/.test(q.l))?'<button class="go dxgo" data-act="dx" data-id="'+esc(q.l)+'">Diagnose</button>':'')+'</div>'+q.c.map(function(c){return pinConn(cab,k,q,c,false)}).join('')+'</li>'}).join('')+'</ul>';
  return s;
}

var SAFE='Only a qualified person should test inside a cabinet. Before touching terminals or measuring resistance, isolate the supply, lock it off and prove it dead with a tester you have just checked. Live measurements need a meter rated for the circuit and the right protective equipment.';
var TIPS={
mpcb:{what:'Protects one motor against overload and short circuit. It is also the manual switch for that motor.',signs:'Knob in the TRIP position, a motor that will not start, or a breaker that trips again soon after a reset.',steps:['Read the knob position: ON, OFF or TRIP. If it has tripped, look for the cause (jammed machine, missing phase, wrong setting) before you reset it.','Compare the current dial with the full-load current on the motor nameplate.','Live and switched on: measure phase to phase on the supply side (1, 3, 5) and on the motor side (2, 4, 6). All readings should be equal on both sides.','Isolated: with the breaker ON, each pole (1–2, 3–4, 5–6) should read close to 0 Ω. With it OFF, each should be open.','Motor running: clamp the current on each phase. The three values should be close to each other and below the dial setting.','Press the test button if there is one. The breaker must trip.']},
mcb:{what:'Protects one circuit against overload and short circuit.',signs:'Lever down or in the middle, a dead circuit, or a warm or discoloured breaker.',steps:['Check the lever. Before resetting, ask what was switched on when it tripped.','Live: measure from the supply terminal and from the load terminal to neutral or 0 V. Voltage on one side only means the breaker is open or faulty.','Isolated: ON should read close to 0 Ω across each pole, OFF should be open.','If it trips at once with the load disconnected, replace the breaker. If it only trips with the load connected, the fault is in the circuit.','Isolated: check the terminal screws. A loose screw shows as heat marks.']},
mccb:{what:'The main switch and protection for the cabinet or for a large feeder.',signs:'Handle in the middle (tripped) position, or no voltage on the load side.',steps:['Handle up is ON, down is OFF, middle is tripped. To reset, push fully to OFF, then to ON.','The supply side stays live when the breaker is OFF. Isolate upstream before working on it.','Live: measure phase to phase on the supply side, then on the load side. Both sets should match.','Check the trip settings on the front against the drawing.','Isolated upstream: ON should read close to 0 Ω across each pole. Look for heat marks on the terminals.','Use the push-to-trip button, if fitted, to prove the mechanism.']},
contactor:{what:'Switches a motor or load when its coil is energised.',signs:'Does not pull in, hums or chatters, or pulls in but the load does not run.',steps:['Give the command and watch the armature. It should pull in with a clear click.','Measure the coil voltage at A1–A2. It should match the coil rating printed on the contactor.','Voltage on the coil but no pull-in: the coil or the mechanism has failed. No voltage on the coil: the fault is upstream, in the control circuit.','Pulled in and loaded: measure across each main pole (1–2, 3–4, 5–6). It should be close to 0 V. More than about a volt means worn contacts.','Isolated: the coil resistance at A1–A2 should be neither open nor zero.','Check that the auxiliary contacts (13–14 normally open, 21–22 normally closed) change state.']},
fuse:{what:'A terminal with a small fuse, or an electronic protector, for one control circuit.',signs:'A dead control circuit. On types with an indicator, a lit lamp usually means a blown fuse.',steps:['Live: measure each side of the terminal to 0 V. Voltage on the supply side only means the fuse has blown.','Isolated: open the lever, take the fuse out and check it reads close to 0 Ω.','Replace it only with the same rating and type.','If the new fuse blows too, find the short circuit before trying again. Never bridge a fuse.']},
fuseholder:{what:'Holds the fuses that protect a power circuit.',signs:'One phase missing downstream, or a motor that hums and does not start.',steps:['Live: measure phase to phase below the fuses. A missing or low reading points to one blown fuse.','Live and loaded: measure across each fuse. Close to 0 V is healthy. Full voltage across it means it has blown.','Isolated: remove the fuses and check each reads close to 0 Ω.','Replace with the same size, rating and characteristic. Check the clips grip firmly and show no heat marks.']},
psu:{what:'Makes the 24 V DC supply for the PLC, the relays and the sensors.',signs:'DC OK lamp off or flashing, PLC and relays dropping out, or a low 24 V reading.',steps:['Check the DC OK lamp.','Measure the input voltage at the input terminals. It should match the nameplate.','Measure the output at + and –. Expect 24 V, usually set between 24 and 28 V.','Input present but output low or zero: isolate, disconnect the output wires, power up and measure again. If 24 V returns, a load is overloading or shorting the supply. If not, the power supply has failed.','Under normal load the output should stay above about 22 V.','Keep the vents clear of dust.']},
transformer:{what:'Steps the mains voltage down for the control circuit.',signs:'No control voltage, a burning smell, or discoloured windings.',steps:['Measure the primary voltage at the input terminals.','Measure the secondary voltage. Unloaded, it reads a little above the rated value.','Primary present but no secondary: check the secondary fuse first.','Isolated and disconnected: measure each winding. Both should read a low resistance. An open reading means a burnt winding.','With an insulation tester, check between primary and secondary, and from each winding to earth.']},
plc:{what:'The controller that runs the machine program.',signs:'RUN lamp off, a red fault lamp, or a red bus-fault lamp.',steps:['Read the lamps: green RUN is normal, STOP means the program is not running, red SF is a system fault, red BF is a bus fault.','Measure the 24 V supply at the L+ and M terminals.','For SF, read the diagnostic buffer with the programming software. It names the faulty module or channel.','For BF, check the bus cable, the connectors and the terminating switches.','Do not change the mode switch or reset the memory unless you know what the machine will do.']},
io:{what:'Connects sensors (inputs) or actuators (outputs) to the PLC. Each channel has its own lamp.',signs:'A channel lamp that does not follow the sensor or the command, or a red fault lamp on the module.',steps:['Input: operate the sensor and measure the input terminal to M. 24 V with the lamp on is healthy. 24 V with the lamp off points to the module. No voltage points to the sensor or its wiring.','Output: with the lamp on, measure the output terminal to M. No voltage with the lamp on points to the module or its L+ supply. Voltage present but nothing moves points to the wiring or the actuator.','Check the module supply on the front connector, and that the connector is fully seated.','A red SF lamp on the module usually means a wire break or a short on one channel.']},
repeater:{what:'Joins or extends segments of the fieldbus network.',signs:'Bus-fault lamps on the PLC or the drives, or stations dropping off the network.',steps:['Check the power lamp and the activity lamp of each segment.','Measure the 24 V supply.','Check the terminating switches: ON at the two ends of each segment only, OFF everywhere else.','Check each bus connector is seated and its cable shield is clamped.','Disconnect segments one at a time to find the one that brings the bus down.']},
safety:{what:'Monitors the emergency stops and the guards, and cuts the power when one opens.',signs:'The machine will not reset or start, or the output lamps stay off.',steps:['Read the lamps: power, then channel 1 and channel 2.','Measure the supply at A1–A2.','Both input channels must be closed: every emergency stop released and every guard shut. Measure across each input pair to find the open one.','Check the reset button and the feedback loop. A welded or stuck contactor keeps the loop open and blocks the reset.','When it is energised, the safety outputs (13–14, 23–24) are closed.','Never bridge a safety circuit. After any work, test the emergency stop before handing the machine back.']},
auxrelay:{what:'A small relay that passes a signal between the PLC and another circuit.',signs:'Lamp on but the signal does not get through, or no lamp when commanded.',steps:['The lamp shows that the coil is energised.','Measure the coil voltage at A1–A2.','Energised: common (11) to normally open (14) should be closed, and 11 to normally closed (12) open.','On a plug-in type, swap it with an identical relay that is known to work.','Isolated: the coil should read neither open nor zero.']},
drive:{what:'Controls the speed and position of one motor.',signs:'A red lamp or a fault code, a motor that does not move, or a bus fault.',steps:['Read the lamps or the display and write down the fault code before you reset anything.','Look the code up in the manual for this drive.','Check the enable signal and the 24 V control supply.','Measure the three input phases. They should be equal.','After isolating, wait for the discharge time printed on the drive (often 5 minutes) before touching the power terminals. The capacitors stay charged.','For a motor or cable fault, disconnect the motor cable at the drive and test the insulation of the cable and the motor. Never use an insulation tester with the drive connected.','Check the fan and the heatsink for dust.']},
vfd:{what:'A compact inverter that sets the speed of one motor.',signs:'A fault code on the display, or a motor that does not follow the speed command.',steps:['Write down the code on the display before you reset it, then look it up in the manual.','Check whether it is in local or remote control, and that the run and speed signals arrive.','Measure the input voltage.','Measure the motor current with a clamp meter. An ordinary voltmeter does not read the output voltage of an inverter correctly.','After isolating, wait for the discharge time printed on the unit before touching the terminals.','Disconnect the motor cable at the inverter before any insulation test.']},
terminal:{what:'Joins the cabinet wiring to the field cables.',signs:'An intermittent fault, a heat mark, or a wire that moves.',steps:['Live: the voltage on both sides of a terminal should be the same.','Isolated: pull each wire gently. It should not move.','Isolated: retighten the screws to the torque printed on the terminal.','Look for discoloured plastic, which shows overheating.','Check that jumper bars are fully pushed in.']},
motor:{what:'Turns the machine part named in its note. It is fed from the cabinet through its breaker and, when there is one, its drive.',signs:'It does not start, hums without turning, runs hot, or its breaker or drive trips.',steps:['Open its pins in this app to find the breaker, the drive or contactor and the terminals that feed it.','Isolated and locked off: measure the three windings at the motor terminals or at the cabinet terminals. The three readings should be equal.','Isolated, cable disconnected from the drive: test the insulation from each winding to earth.','Check that the shaft turns freely by hand, and that the brake releases if the motor has one.','Running: clamp the current on each phase. The three values should be close to each other and below the nameplate current.']},
brake:{what:'Holds the motor shaft when it is not powered. It releases when its coil is fed.',signs:'The motor trips or overheats at start (brake does not release), or the load slips at standstill (brake worn).',steps:['Find its contactor or relay with the pins in this app, then listen for the click when the brake is commanded.','Live: measure the coil voltage at the brake terminals while it is commanded.','Isolated: measure the coil resistance and compare it with the nameplate. An open circuit means a broken coil or rectifier.','Check the air gap and the lining wear as the motor manual describes.']},
resistor:{what:'Takes the energy that the motor returns to the drive when it slows down.',signs:'The drive trips on DC-bus overvoltage while braking, or the resistor is discoloured or very hot at rest.',steps:['Isolated, drive discharged: disconnect one wire and measure the resistance. Compare it with the value on its plate.','Test the insulation from the resistor to its housing.','Check that the wires go to the braking terminals of the right drive, as the pins in this app show.']},
sensor:{what:'Tells the PLC that a part is present or in position. The PLC input it is wired to is shown in its note and in its pins.',signs:'A step of the machine that does not start, or an input that stays on or off.',steps:['Look at the lamp on the sensor while you place a target in front of it, then at the lamp of its PLC input.','Live: measure the supply between pin 1 (+) and pin 2 or 3 (0 V), as wired on the drawing.','Measure the signal wire to 0 V with and without a target. It should switch between about 24 V and 0 V.','If the sensor switches but the input does not, follow the wire through the junction box terminals shown in the pins.','Check the sensing distance, the fixing and the cable where it flexes.']},
switch:{what:'A mechanical contact operated by the machine, often an end-of-travel or over-travel limit.',signs:'A movement that will not start or that stops early, or an over-travel fault that does not clear.',steps:['Check the lever or plunger: free to move, not bent, and really operated by the cam.','Isolated: measure the contact. A normally closed contact (11–12) reads close to 0 Ω at rest and opens when operated.','Live: measure the voltage on both sides of the contact to see where it stops.','Follow the wire to its relay or PLC input with the pins in this app.']},
encoder:{what:'Measures a position and sends it to the PLC, here as one input per bit.',signs:'A wrong or jumping position, or a movement that stops at the wrong place.',steps:['Live: measure its supply at the junction box terminals.','Turn the shaft slowly and watch the input lamps of its PLC module. Every bit must change in turn. A bit that never changes points to a broken core or input.','Use the wire colours in its pins to find each bit.','Check the coupling: a loose coupling gives a position that drifts.']},
valve:{what:'Switches compressed air or oil to a cylinder when its coil is fed.',signs:'A cylinder that does not move, moves slowly, or does not return.',steps:['Look at the lamp on the coil connector while the PLC output is on, then at its relay and breaker shown in the pins.','Live: measure 24 V at the coil connector while it is commanded.','Isolated: measure the coil resistance. An open circuit means a burnt coil.','If the coil is fed and nothing moves, use the manual override on the valve to tell an electrical fault from a pneumatic or hydraulic one.']},
button:{what:'Lets the operator give a command: push button, selector or emergency stop.',signs:'A command that is not taken, or an emergency-stop circuit that will not reset.',steps:['Isolated: measure each contact block while you operate the button. NC contacts open, NO contacts close.','For an emergency stop, check both channels: each must open when it is pressed and close when it is released.','Check that the contact block is clipped fully onto the head.','Follow the wire to the safety relay or the PLC input with the pins in this app.']},
lamp:{what:'Shows a state to the operator.',signs:'It stays dark or stays lit when it should not.',steps:['Live: measure the voltage on the lamp terminals x1 and x2 when it should be lit. Voltage present and no light means the lamp is dead.','No voltage: follow the wire back to the contact or output that feeds it, shown in the pins.','Use the lamp test of the machine if there is one.']},
horn:{what:'Warns people around the machine with sound or light.',signs:'No warning at start-up, or a horn that never stops.',steps:['Live: measure the voltage on its terminals while it is commanded.','Check its fuse and the relay contact that feeds it, shown in the pins.']},
diode:{what:'Lets current pass in one direction only. Here it keeps the PLC outputs that share one drive input apart.',signs:'A drive input that never comes on, or two commands that come on together.',steps:['Isolated, one side disconnected: use the diode test of the meter. About 0.5 to 0.7 V one way, open the other way.','Live: with the output on, about the same voltage should be found on both sides, less roughly 0.7 V.']},
thermostat:{what:'Switches the cabinet fan or heater at a set temperature.',signs:'A hot cabinet with the fan stopped, or a fan that never stops.',steps:['Turn the dial below and above the room temperature and listen for the click.','Isolated: measure the contact while you turn the dial.','Live: measure the voltage after the contact when the fan should run.']},
fan:{what:'Moves air through the cabinet to cool it.',signs:'High temperature in the cabinet, drive over-temperature faults, noise.',steps:['Check that it turns freely and that the filters are clean.','Live: measure the voltage on its terminals while the thermostat calls for cooling.','If voltage is present and it does not turn, replace the fan.']},
socket:{what:'Service socket inside the cabinet, for a laptop or a tool.',signs:'No voltage on the socket.',steps:['Check its breaker.','Live: measure the voltage between the two pins, and from the phase pin to the earth contact.']},
unknown:{what:'This module has not been identified yet.',signs:'',steps:['Read the nameplate and add the model in the studio.','Follow the manufacturer manual for this part.']},
foreign:{what:'This object does not belong in the cabinet.',signs:'',steps:['Isolate the cabinet, then remove it.']}
};

function issues(cab){
  var shs=sheets().filter(function(x){return x.id!=='manual'}),nread=shs.filter(function(x){return x.read}).length,dt=drawTags(),tm=tagMap(cab),fm=farMap(cab);
  var o={hasDraw:nread>0,unread:shs.length-nread,noComp:[],noTag:[],conflict:[],counts:[],wchk:0,cchk:0,foreign:0};
  Object.keys(dt).sort(tagSort).forEach(function(t){var e=dt[t],c=tm[t];
    if(c){if(e.ty&&TYPES[e.ty]&&c.t!=='unknown'&&e.ty!=='unknown'&&e.ty!==c.t)o.conflict.push({tag:t,c:c,ty:e.ty})}
    else if(!fm[t]&&!isExt(cab,t))o.noComp.push(e)});
  cab.comps.forEach(function(c){if(c.t==='foreign'){o.foreign++;return}if(c.chk)o.cchk++;if(o.hasDraw&&(!c.tagOk||!dt[normTag(c.tag)]))o.noTag.push(c)});
  wireList().forEach(function(x){if(x.w.chk)o.wchk++});
  if(o.hasDraw){var pc={},dc={};
    cab.comps.forEach(function(c){if(c.t!=='foreign')pc[c.t]=(pc[c.t]||0)+1});
    Object.keys(dt).forEach(function(t){var e=dt[t];if(e.ty&&TYPES[e.ty]&&e.ty!=='foreign'&&cab.ext.indexOf(t)<0&&!fm[t])dc[e.ty]=(dc[e.ty]||0)+1});
    Object.keys(TYPES).forEach(function(t){if(t!=='foreign'&&(pc[t]||dc[t]))o.counts.push({t:t,p:pc[t]||0,d:dc[t]||0})})}
  o.open=o.noComp.length+o.noTag.length+o.conflict.length+o.foreign+o.cchk+o.wchk+o.unread;
  return o;
}

    if(is.conflict.length)s+='<p class="eyebrow">Different type <span>'+is.conflict.length+'</span></p><ul class="rows">'+is.conflict.map(function(x){return '<li><button data-act="show" data-id="'+esc(x.c.id)+'"><span class="tag">'+esc(x.tag)+'</span><span class="nm">Photo: '+esc(TY(x.c.t).label)+'<small>Drawing: '+esc(TYPES[x.ty].label)+'</small></span></button></li>'}).join('')+'</ul>';
  }
  var other=[];

  if(false){

    else if(S.confirm==='withdraw')s+='<div class="acts"><p>Remove this cabinet from the field view?</p><button class="btn danger" data-act="withdrawyes">Withdraw</button><button class="btn" data-act="delno">Keep</button></div>';
    else s+='<div class="acts"><button class="btn primary" data-act="validate">'+(cab.val?'Validate again':'Validate for the field view')+'</button>'+(cab.val?'<button class="btn danger" data-act="withdraw">Withdraw</button>':'')+'</div><p class="hint">'+(is.open?is.open+' open '+(is.open===1?'point':'points')+'. ':'Nothing is open. ')+'Validating copies the layout, the wires and the drawings to the field view. Later changes stay in the studio until you validate again.</p>';
  }
  return s;
}
function dropPublished(id){
  return db.collection('published/'+id+'/sheets').get().then(function(snap){var p=Promise.resolve();snap.docs.forEach(function(d){p=p.then(function(){return db.doc('published/'+id+'/sheets/'+d.id).delete()})});return p}).then(function(){return db.doc('published/'+id).delete()});
}
function publishOne(cab){
  var id=cab.id,shs=sheetList(id),at=new Date().toISOString();
  var fin=function(){cab.val={at:at,upd:''};touch(id);cab.val.upd=cab.updated};
  if(S.mode!=='db'){var pc=normCab(id,JSON.parse(JSON.stringify(serial(cab))));pc.val={at:at,upd:''};S.pub.set(id,pc);var m=new Map();shs.forEach(function(x){m.set(x.id,normSheet(x.id,JSON.parse(JSON.stringify(serialSheet(x)))))});sheetStore.set('p:'+id,m);fin();return Promise.resolve()}
  return db.collection('published/'+id+'/sheets').get().then(function(snap){
    var keep={},p=Promise.resolve();shs.forEach(function(x){keep[x.id]=1});
    snap.docs.forEach(function(d){if(!keep[d.id])p=p.then(function(){return db.doc('published/'+id+'/sheets/'+d.id).delete()})});
    shs.forEach(function(x){p=p.then(function(){return db.doc('published/'+id+'/sheets/'+x.id).set(serialSheet(x))})});
    return p;
  }).then(function(){var data=serial(cab);data.val={at:at,upd:''};return db.doc('published/'+id).set(data)}).then(fin);
}
function publishCab(){
  var cab=cur();if(!cab||S.vbusy)return;
  S.confirm=null;S.vbusy=true;render();
  publishOne(cab).then(function(){S.vbusy=false;toast('Validated. The cabinet is now in the field view.');render()},function(){S.vbusy=false;toast('The validation could not be saved. Check the connection and try again.');render()});
}
function publishGroup(g){
  var list=groupCabs(g),i=0;if(S.vbusy||!list.length)return;
  S.confirm=null;S.vbusy=true;render();
  (function next(){
    if(i>=list.length){S.vbusy=false;toast(list.length+' cabinets validated. They are now in the field view.');render();return}
    publishOne(list[i++]).then(next,function(){S.vbusy=false;toast('The validation stopped after '+(i-1)+' of '+list.length+' cabinets. Check the connection and try again.');render()});
  })();
}
function withdrawCab(){
  var cab=cur();if(!cab)return;var id=cab.id;S.confirm=null;cab.val=null;touch(id);

function addProgram(file){

  file.arrayBuffer().then(function(buf){
    var src;try{src=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){src=new TextDecoder('windows-1252').decode(buf)}
    var hc=hwParse(src),sy=hc?null:symParse(src),bl=sy||hc?[]:awlParse(src),dbs=sy||hc?[]:bl.dbs,what=[];
    if(hc)what.push('hardware configuration ('+hc.mods.length+' modules)');
    else if(sy)what.push('symbol table ('+Object.keys(sy).length+' symbols)');
    else{
      if(bl.length>6)what.push(bl.length+' blocks ('+bl.reduce(function(n,b){return n+b.nets.length},0)+' networks)');else bl.forEach(function(b){what.push(b.name+' ('+b.nets.length+' networks)')});
      if(dbs.length>6)what.push(dbs.length+' data blocks');else dbs.forEach(function(d){what.push('data block '+d.name+' ('+d.vars.length+' variables)')});
    }
    if(!what.length){toast('Nothing usable was found in this file. In STEP 7, export the blocks as an AWL (STL) source, the symbol table as .SDF, or the hardware configuration as .cfg.');return}
    var nm=String(file.name||'program').slice(0,60),label=hc?'Hardware configuration':sy?'Symbol table':bl.map(function(b){return b.name}).concat(dbs.map(function(d){return 'DB '+d.name})).join(', ').slice(0,80);
    function keep(entry){
      var rest=(cab.prog||[]).filter(function(p){return p.file!==nm}),tot=rest.concat([entry]).reduce(function(n,p){return n+(p.z?p.z.length:String(p.src||'').length)},0);
      if(tot>900000){toast('The program files of this cabinet are too large together. Remove one first.');return}
      cab.prog=rest.concat([entry]).slice(-12);progErr='';
      changed();render();toast('Added: '+what.join(', ')+'.');
    }
    if(typeof CompressionStream==='undefined'){
      if(src.length>400000){toast('This browser cannot pack a file of this size. Use a current version of Chrome, Edge, Firefox or Safari.');return}
      keep({file:nm,name:label,src:src});return;
    }

      var e={file:nm,name:label,z:b64Enc(z),n:src.length};PROGSRC[progKey(e)]=src;keep(e);
    },function(){toast('The file could not be packed.')});
  },function(){toast('The file could not be read.')});
}


/* ----- simulation: the program read from the files is run here, cycle after cycle, without a PLC -----

var simT=null,simLastShow=0;

  while((m=re.exec(t))){hit=true;ms+=parseFloat(m[1])*({ms:1,s:1000,m:60000,h:3600000})[m[2]]}
  if(hit&&/^[\d.\s]*(ms|h|m|s)/.test(t))return ms;

// the order the PLC works in: every write of the cyclic program, every timer and counter, in the order of the networks
function simPrep(M){

// one cycle of the program. Returns true when a bit changed, 0 when only a timer is running, false when nothing moved

      else if(T.type==='off'){if(s){ts.q=true;ts.run=false}else{if(fall){ts.run=true;ts.t0=now}if(done()){ts.run=false;ts.q=false}}}
      else if(T.type==='pulse'){if(!s){ts.run=false;ts.q=false}else{if(rise){ts.run=true;ts.t0=now;ts.q=true}if(done()){ts.run=false;ts.q=false}}}
      else if(T.type==='xpulse'){if(rise){ts.run=true;ts.t0=now;ts.q=true}if(done()){ts.run=false;ts.q=false}}
      else{if(rise&&!ts.run&&!ts.q){ts.run=true;ts.t0=now}if(done()){ts.run=false;ts.q=true}}
      if(T.r&&dxE(M,T.r,C)===true){ts.run=false;ts.q=false}

      if(Z.r&&dxE(M,Z.r,C)===true)cs.n=0;

var PROMPT='The image is a photo of an open industrial electrical control cabinet. List the components mounted in it so an app can rebuild the cabinet layout.\n\nReply with only a JSON array, no other text. Each item is one group of identical units mounted side by side:\n{"type": string, "count": integer, "box": [x0, y0, x1, y1], "note": string, "sure": boolean}\n\n- "box" is the bounding box of the whole group in thousandths of the image width (x) and height (y), from 0 to 1000, top-left origin. Make boxes tight.\n- "count" is the number of separate units in the group. A terminal strip is one unit whatever its length.\n- "sure" is false whenever the type or the count is a guess.\n- "note" is at most 12 words: brand or model if readable, or why you are unsure. Use "" if nothing to add.\n- Do not list wires, cables, cable ducts, rails or the enclosure itself. At most 60 items, in reading order from top-left.\n\nAllowed "type" values:\nmpcb = motor protection circuit breaker (rotary knob or start/stop buttons)\nmcb = miniature circuit breaker (count each device, not each pole)\nmccb = large moulded-case breaker\ncontactor = power contactor\nfuse = slim fuse terminal or electronic circuit protector\nfuseholder = fuse holder or fuse switch\npsu = DIN-rail power supply\ntransformer = control transformer\nplc = PLC CPU or head/interface module\nio = PLC input/output module\nrepeater = fieldbus repeater, switch or gateway\nsafety = safety relay (usually yellow)\nauxrelay = small relay or interface relay\ndrive = servo drive or frequency inverter, book or tall format\nvfd = compact inverter with its own keypad\nterminal = terminal strip\nunknown = a module you cannot identify\nforeign = an object that does not belong in a cabinet\n\nExample: [{"type":"mcb","count":6,"box":[110,360,470,415],"note":"","sure":true}]';
function expand(items,aspect){
  var out=[],cnt={},seq=0;
  if(!Array.isArray(items))return out;
  items.slice(0,80).forEach(function(g){
    if(!g||!Array.isArray(g.box)||g.box.length<4)return;
    var t=TYPES[g.type]?g.type:'unknown',b=g.box.map(function(v){return clamp((+v||0)/1000,0,1)});
    var x0=Math.min(b[0],b[2]),x1=Math.max(b[0],b[2]),y0=Math.min(b[1],b[3]),y1=Math.max(b[1],b[3]);
    if(x1-x0<0.004||y1-y0<0.004)return;
    var cn=t==='terminal'?1:clamp(Math.round(+g.count||1),1,40),gap=cn>1?0.0012:0,uw=((x1-x0)-gap*(cn-1))/cn;

      var L0=TYPES[t].letter,tag='';if(L0){cnt[L0]=(cnt[L0]||0)+1;tag=L0+cnt[L0]}
      out.push({id:'d'+(++seq).toString(36)+Math.random().toString(36).slice(2,6),t:t,tag:tag,x:x0+i*(uw+gap),y:y0,w:uw,h:y1-y0,chk:g.sure===false||t==='unknown'||t==='foreign',model:'',note:String(g.note||'').slice(0,200),sheet:''});
    }
  });
  return out;
}

  s+='<p class="hint">'+(st?(st.reset?'Reset from the phone is ON for this machine ('+esc(st.resetBit)+').':'Reset from the phone is OFF for this machine'+(!st.resetBit?': no reset bit.':!st.resetCode?': no reset code.':!st.plc?': no PLC address.':'.')):'')+'</p>';

// the draft, checked; null and a message when something is wrong
function msClean(){
  var R=S.ms,M=macGet(R.id),host=String(R.host||'').trim(),n=function(v,lo,hi){v=String(v).trim();if(!/^\d+$/.test(v))return null;v=+v;return v>=lo&&v<=hi?v:null};
  var port=n(R.port||'102',1,65535),rack=n(R.rack||'0',0,7),slot=n(R.slot||'2',0,31),bit=String(R.bit||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!String(R.name).trim())return {err:'Give the machine a name.'};
  if(!/^[A-Za-z0-9.\-]*$/.test(host))return {err:'The IP address can hold digits, letters, dots and dashes only.'};
  if(port==null||rack==null||slot==null)return {err:'Port 1 to 65535, rack 0 to 7, slot 0 to 31.'};
  if(bit&&!/^(M\d{1,5}\.[0-7]|DB\d{1,5}\.DBX\d{1,5}\.[0-7])$/.test(bit))return {err:'The reset request bit must be a memory bit (M600.0) or a data-block bit (DB10.DBX4.0).'};
  return {M:{id:R.id,name:String(R.name).trim().slice(0,80),desc:String(R.desc||'').trim().slice(0,200),order:M?M.order:0,plc:{host:host,port:port,rack:rack,slot:slot},resetBit:bit}};
}
function msSave(then){
  var R=S.ms,c=msClean();if(R.busy)return;
  if(c.err){R.msg=c.err;R.ok=false;render();return}
  R.busy=true;R.msg='';render();
  db.doc('machines/'+R.id).set(serialMac(c.M)).then(function(){
    S.mac.set(R.id,normMac(R.id,serialMac(c.M)));R.busy=false;R.bit=c.M.resetBit;
    if(then)then();else{R.msg='Saved.';R.ok=true;render();msStatus()}
  },function(){R.busy=false;R.msg='Could not save. Check the connection and try again.';R.ok=false;render()});
}
Object.assign(ACT,{
  macs:function(){if(S.busy||S.wbusy||S.vbusy)return;S.mid=null;S.view='home';S.cabId=null;S.sel=null;S.confirm=null;macRemember(null);render()},

    var M=normMac(id,{name:'Machine '+(L.length+1),order:ord});

  },

      h.plcTest(R.id).then(function(r){R.busy=false;R.msg='Saved. The PLC answers'+(r&&r.unread&&r.unread.length?' (some addresses were refused: '+r.unread.join(', ')+')':'')+'.';R.ok=true;render();msStatus()},
        function(e){R.busy=false;R.msg='Saved, but the PLC does not answer. '+((e&&e.message)||'');R.ok=false;render();msStatus()})});
  },

      R.busy=true;render();
      h.setResetCode(R.id,code).then(function(){R.busy=false;R.code='';R.rmsg='Reset bit and code saved. Give the code only to the people allowed to reset.';R.rok=true;render();msStatus()},
        function(e){R.busy=false;R.rmsg=(e&&e.message)||'The code could not be saved.';R.rok=false;render()});
    });
  },
  mscodeoff:function(){var R=S.ms,h=macHost();R.busy=true;render();h.setResetCode(R.id,'').then(function(){R.busy=false;R.rmsg='Reset code removed: reset from the phone is off for this machine.';R.rok=true;render();msStatus()},function(e){R.busy=false;R.rmsg=(e&&e.message)||'Could not remove the code.';R.rok=false;render()})},
  msdel:function(){S.confirm='mac';render()},
  msdelno:function(){S.confirm=null;render()},
  msdelyes:function(){
    var id=S.ms&&S.ms.id;if(!id||macCabs(id).length)return;S.confirm=null;
    db.doc('machines/'+id).delete().then(function(){S.mac.delete(id);S.mid=null;S.view='home';S.ms=null;macRemember(null);render();toast('Machine deleted.')},function(){toast('Could not delete. Check the connection and try again.')});
  }
});
document.addEventListener('input',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-ms');if(k&&S.ms)S.ms[k]=e.target.value});
/* ---------- end of the machines ---------- */
/* ---------- production and maintenance: what the server follows for each machine, day and night ----------
   The Studio finds in the program what to follow (the PLC's counters, the movements and their end switches, the drives, the alarms)
   and saves it as moncfg/<machine>. The server keeps the totals per hour, shift and day; these pages show them. */
var PMT=null;
function pmCan(){return !!(window.cmHost&&window.cmHost.role&&!window.cmHost.local)&&S.mid!==MAC_ALL}
function pmGet(u){u+=(u.indexOf('?')<0?'?':'&')+'machine='+encodeURIComponent(S.mid);return fetch(u,{credentials:'same-origin'}).then(function(r){return r.json().then(function(j){if(!r.ok)throw (j&&j.error)||{message:'The server said no.'};return j})})}
function pmDay(t){var d=new Date(t),p=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function pmOpen(kind){
  if(!S.pm||S.pm.mid!==S.mid)S.pm={mid:S.mid,st:null,days:null,cfg:null,draft:null,err:'',busy:0,range:7,daysAt:0};
  var P=S.pm;P.kind=kind;P.tab=kind==='prod'?'now':'watch';P.draft=null;
  S.view='pm';S.cabId=null;S.sel=null;render();pmLoad(true);
  if(!PMT)PMT=setInterval(function(){if(S.view==='pm'&&S.pm&&!document.hidden&&S.pm.tab!=='cfg')pmLoad(false)},5000);
}
function pmLoad(full){
  var P=S.pm;if(!P||!pmCan())return;P.busy++;
  var jobs=[pmGet('/api/mon/status').then(function(s){P.st=s;P.err=''})];
  if(full||Date.now()-P.daysAt>60000){P.daysAt=Date.now();jobs.push(pmGet('/api/mon/days?from='+pmDay(Date.now()-(P.range+1)*864e5)).then(function(r){P.days=r.days}))}
  if(full||!P.cfg)jobs.push(db.doc('moncfg/'+S.mid).get().then(function(d){P.cfg=d.exists?d.data():null}));
  Promise.all(jobs).catch(function(e){P.err=(e&&e.message)||'The server could not be read.'}).then(function(){P.busy--;pmPaint()});
}
function pmPaint(){if(S.view!=='pm')return;var a=document.activeElement;if(a&&a.closest&&a.closest('#pm')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;var sc=$('#pm'),top=sc?sc.scrollTop:0;render();sc=$('#pm');if(sc)sc.scrollTop=top}
function pmHM(s){s=Math.round(s||0);var h=Math.floor(s/3600),m=Math.round(s%3600/60);if(m===60){h++;m=0}return h?h+' h '+(m<10?'0':'')+m:m+' min'}
function pmTime(t){return new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function pmNum(x){return (Math.round(x*100)/100).toLocaleString()}
function pmEsc(s){return esc(String(s===undefined||s===null?'':s))}
function pmAlarmText(cfg,id){var a=(cfg&&cfg.alarms||[]).filter(function(x){return x.id===id})[0];return a?((a.no?'Alarm '+a.no+' · ':'')+(a.text||id)):id}
function pmShiftEnd(cfg,i){var sh=cfg.shifts,h=sh[(i+1)%sh.length];return (h<10?'0':'')+h+':00'}

/* ----- the page ----- */
function pmHTML(){
  var P=S.pm,st=P.st,cfg=st&&st.cfg,prod=P.kind==='prod',ed=S.app==='studio'&&S.canWrite&&S.mode==='db';
  var tabs=prod?[['now','This shift'],['shifts','Shifts'],['stops','Stops'],['mat','Materials']]:[['watch','To watch'],['moves','Movements'],['drives','Drives'],['alarms','Alarms']];
  tabs.push(['cfg',ed?'What is followed':'Followed']);

  s+='<div class="chips">'+tabs.map(function(t){return '<button data-act="pmtab" data-id="'+t[0]+'" aria-pressed="'+(P.tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(P.err)s+='<div class="dxres bad">'+esc(P.err)+'</div>';
  if(!st)return s+'<p class="note">'+(P.busy?'Reading…':'')+'</p></div>';
  if(P.tab==='cfg')return s+pmCfgHTML(ed)+'</div>';

  s+='<p class="note">'+(st.ok?'Following the PLC'+(st.last?' · read at '+esc(new Date(st.last).toLocaleTimeString()):''):'<b class="bad">Not following the PLC now:</b> '+esc(st.error||''))+'. The server keeps counting while this page is closed.</p>';
  if(prod){if(P.tab==='now')s+=pmNowHTML(st);else if(P.tab==='shifts')s+=pmShiftsHTML(st);else if(P.tab==='stops')s+=pmStopsHTML(st);else s+=pmMatHTML(st)}
  else{if(P.tab==='watch')s+=pmWatchHTML(st,ed);else if(P.tab==='moves')s+=pmMovesHTML(st,ed);else if(P.tab==='drives')s+=pmDrivesHTML(st);else s+=pmAlarmsHTML(st)}
  return s+'</div>';
}
function pmMain(cfg){return cfg.counters.filter(function(c){return c.main})[0]||cfg.counters[0]}
function pmRange(){return '<div class="chips">'+[[1,'Today'],[7,'7 days'],[30,'30 days'],[90,'90 days']].map(function(r){return '<button data-act="pmrange" data-id="'+r[0]+'" aria-pressed="'+(S.pm.range===r[0])+'">'+r[1]+'</button>'}).join('')+'</div>'}
function pmDaysIn(){var P=S.pm,from=pmDay(Date.now()-(P.range-1)*864e5);return (P.days||[]).filter(function(d){return P.range===1?d.date===P.st.slot.date:d.date>=from})}
function pmCsv(what){return '<a class="btn" href="/api/mon/export?machine='+encodeURIComponent(S.mid)+'&what='+what+'&from='+pmDay(Date.now()-(S.pm.range-1)*864e5)+'">Export to Excel (.csv)</a>'}

/* this shift: the counters, the times, the stop now, the day hour by hour */
function pmNowHTML(st){
  var cfg=st.cfg,D=st.today,sl=st.slot,sh=D?D.shifts[sl.shift]:null,mc=pmMain(cfg),s='';
  s+='<p class="eyebrow">Shift '+esc(cfg.shifts.map(function(h){return (h<10?'0':'')+h+':00'})[sl.shift])+' – '+esc(pmShiftEnd(cfg,sl.shift))+' <span>'+esc(sl.date)+'</span></p>';

  if(sh){

    if(cfg.auto.length)s+='<div class="pmtile"><b>'+pmHM(sh.autoS)+'</b><span>In automatic</span></div>';
    if(cfg.alarms.length)s+='<div class="pmtile"><b>'+pmHM(sh.alarmS)+'</b><span>With an alarm · '+sh.stops.length+' stop'+(sh.stops.length===1?'':'s')+'</span></div>';

  }

// the production day hour by hour: one bar per hour, from the first shift of the day
function pmHoursHTML(cfg,D,mc,sl){
  var h0=cfg.shifts[0],H=[],mx=0,i,now=new Date().getHours();
  for(i=0;i<24;i++){var h=(h0+i)%24,k=(h<10?'0':'')+h,n=0;D.shifts.forEach(function(x){var b=x.hours[k];if(b&&b[mc.id])n+=b[mc.id]});H.push({k:k,n:n,h:h});mx=Math.max(mx,n)}

// the shifts of the days chosen

// the stops: which alarms cost the most time, then each stop

function pmMatHTML(st){

/* ----- maintenance ----- */
function pmMoveRows(st){
